<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="u36-FtkXCnHJ3qi2akqjFoLQ2M7pudNXb6r19_hKcMg" />
    <title>스마트 대시보드 | 나만의 통합 포털 서비스</title>
    <meta name="description" content="자주 사용하는 모든 사이트를 한눈에 관리하는 개인 맞춤형 대시보드입니다. 빠른 검색과 카테고리별 링크 정리를 지원합니다.">
    <meta name="keywords" content="대시보드, 통합포털, 즐겨찾기, 링크관리, 시작페이지">
    <link rel="canonical" href="https://azit4376-blip.github.io/bookmark/">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="스마트 대시보드 Pro">
    <meta property="og:description" content="매일 방문하는 사이트들을 한 곳에서 편리하게 관리하세요.">
    <meta property="og:url" content="https://azit4376-blip.github.io/bookmark/">
    <meta property="og:image" content="https://www.google.com/s2/favicons?domain=google.com&sz=128">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --radius: 16px;
            --radius-lg: 20px;
            --gap: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 상단 네비게이션 */
        .top-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .nav-btn {
            background: var(--bg-light);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* 컨테이너 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 0 4px;
        }

        .header-left h1 {
            font-size: 32px;
            font-weight: 800;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header-left .subtitle {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 500;
        }

        .clock-box {
            text-align: right;
        }

        #cur-time {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        #cur-date {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 2px;
            font-weight: 500;
        }

        /* 검색 섹션 */
        .search-section {
            max-width: 700px;
            margin: 0 auto 48px;
        }

        .search-bar {
            background: white;
            border-radius: 50px;
            padding: 8px 8px 8px 20px;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1), var(--shadow-lg);
        }

        .engine-selector {
            display: flex;
            align-items: center;
            background: var(--bg-light);
            padding: 6px 12px;
            border-radius: 25px;
            border: 1px solid var(--border);
            gap: 8px;
            flex-shrink: 0;
        }

        .engine-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            object-fit: contain;
        }

        .engine-select {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: var(--text-dark);
            padding: 8px;
        }

        .search-bar input::placeholder {
            color: var(--text-gray);
        }

        .search-btn {
            background: var(--primary);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .search-btn:active {
            transform: scale(0.95);
        }

        /* 대시보드 그리드 - Masonry 레이아웃 */
        .dashboard-main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-auto-rows: 1px;
            gap: 0 var(--gap);
            align-items: start;
        }

        /* 카테고리 그룹 */
        .category-group {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: var(--gap);
            width: 100%;
        }

        .category-group:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        /* 카테고리 헤더 */
        .category-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-title {
            font-size: 15px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .accordion-toggle {
            font-size: 20px;
            color: white;
            transition: transform 0.3s ease;
            display: none;
        }

        .accordion-toggle.active {
            transform: rotate(180deg);
        }

        /* 북마크 리스트 */
        .bookmark-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bookmark-item {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 11px 14px;
            text-decoration: none;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .bookmark-item:hover {
            background: white;
            border-color: var(--primary);
            transform: translateX(4px);
            box-shadow: var(--shadow);
        }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .icon-box img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .icon-box.emoji {
            font-size: 16px;
            border: none;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .bookmark-name {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-arrow {
            font-size: 14px;
            color: var(--text-gray);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .bookmark-item:hover .bookmark-arrow {
            opacity: 1;
        }

        /* 스켈레톤 로딩 */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            height: 300px;
            border-radius: var(--radius-lg);
            margin-bottom: var(--gap);
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 모달 */
        #guide-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 36px 32px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-xl);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        .modal-content p {
            font-size: 15px;
            color: var(--text-gray);
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .close-modal {
            background: var(--primary);
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-modal:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* 푸터 */
        .footer {
            text-align: center;
            margin-top: 80px;
            padding: 24px 0;
            color: var(--text-gray);
            font-size: 13px;
            font-weight: 500;
        }

        /* 모바일 반응형 (아코디언) */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px 40px;
            }

            header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-left h1 {
                font-size: 28px;
            }

            .clock-box {
                text-align: center;
            }

            #cur-time {
                font-size: 24px;
            }

            .dashboard-main {
                grid-template-columns: 1fr;
            }

            /* 모바일에서 아코디언 토글 표시 */
            .accordion-toggle {
                display: block;
            }

            /* 모바일에서 북마크 리스트 접힘 */
            .bookmark-list {
                max-height: 0;
                overflow: hidden;
                padding: 0 12px;
                transition: all 0.3s ease;
            }

            .bookmark-list.active {
                max-height: 2000px;
                padding: 12px;
            }

            .category-group:hover {
                transform: none;
            }

            .search-bar {
                padding: 6px 6px 6px 16px;
            }

            .search-bar input {
                font-size: 15px;
            }

            .engine-selector {
                padding: 4px 10px;
            }

            .engine-select {
                font-size: 13px;
            }

            .search-btn {
                width: 40px;
                height: 40px;
            }

            .nav-btn {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        @media (min-width: 769px) and (max-width: 1100px) {
            .dashboard-main {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1101px) and (max-width: 1400px) {
            .dashboard-main {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1401px) and (max-width: 1750px) {
            .dashboard-main {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1751px) {
            .dashboard-main {
                grid-template-columns: repeat(5, 1fr);
            }

            .container {
                max-width: 1850px;
            }
        }
    </style>
</head>
<body>

<!-- 상단 네비게이션 -->
<div class="top-nav">
    <div class="nav-btn" onclick="showGuide('start')">
        <span>🏠</span>
        <span>시작페이지</span>
    </div>
    <div class="nav-btn" onclick="showGuide('book')">
        <span>⭐</span>
        <span>즐겨찾기</span>
    </div>
</div>

<!-- 메인 컨테이너 -->
<div class="container">
    <!-- 헤더 -->
    <header>
        <div class="header-left">
            <h1 id="greeting">Portal Master</h1>
            <div class="subtitle">나만의 통합 대시보드</div>
        </div>
        <div class="clock-box">
            <div id="cur-time"></div>
            <div id="cur-date"></div>
        </div>
    </header>

    <!-- 검색 섹션 -->
    <div class="search-section">
        <div class="search-bar">
            <div class="engine-selector">
                <img id="current-engine-icon" class="engine-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt="검색엔진">
                <select class="engine-select" id="search-engine" onchange="updateEngineIcon()">
                    <option value="https://www.google.com/search?q=" data-domain="google.com">구글</option>
                    <option value="https://search.naver.com/search.naver?query=" data-domain="naver.com">네이버</option>
                    <option value="https://search.daum.net/search?q=" data-domain="daum.net">다음</option>
                    <option value="https://www.bing.com/search?q=" data-domain="bing.com">Bing</option>
                    <option value="https://www.youtube.com/results?search_query=" data-domain="youtube.com">유튜브</option>
                    <option value="https://namu.wiki/w/" data-domain="namu.wiki">나무위키</option>
                    <option value="https://www.coupang.com/np/search?channel=user_side&lptag=AF1397652&q=" data-domain="coupang.com">쿠팡</option>
                    <option value="https://www.musinsa.com/search/musinsa/integration?q=" data-domain="musinsa.com">무신사</option>
                </select>
            </div>
            <input type="text" id="search-input" placeholder="검색어를 입력하세요" onkeypress="if(event.keyCode==13) doSearch();">
            <button class="search-btn" onclick="doSearch()">🔍</button>
        </div>
    </div>

    <!-- 대시보드 그리드 -->
    <div class="dashboard-main" id="main-grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <!-- 푸터 -->
    <div class="footer">
        © 2026 Smart Dashboard Pro. All rights reserved.
    </div>
</div>

<!-- 가이드 모달 -->
<div id="guide-modal">
    <div class="modal-content">
        <h2 id="modal-title">안내</h2>
        <p id="modal-text"></p>
        <button class="close-modal" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwp_biaKSxfJMMcFcvP23s8fPHXUPwha9GbsXxX3QmBDqyVGBN4MBSDfu0zWiDMK9DK/exec";
    const STORAGE_KEY = "DASHBOARD_DATA_CACHE";
    let isMobile = window.innerWidth <= 768;

    // 모달 관련 함수
    function showGuide(type) {
        const modal = document.getElementById('guide-modal');
        if(type === 'start') {
            document.getElementById('modal-title').innerText = "🏠 시작페이지 설정";
            document.getElementById('modal-text').innerHTML = "브라우저 우측 상단 [점 3개] → [설정] → [시작 그룹]에서<br>현재 주소를 등록하세요!";
        } else {
            document.getElementById('modal-title').innerText = "⭐ 즐겨찾기 단축키";
            document.getElementById('modal-text').innerHTML = "Windows: <strong>Ctrl + D</strong><br>Mac: <strong>Cmd + D</strong>";
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('guide-modal').style.display = 'none';
    }

    // 모달 외부 클릭 시 닫기
    document.getElementById('guide-modal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // Masonry 레이아웃 함수들
    function resizeGridItem(item) {
        const grid = document.getElementById("main-grid");
        const rowHeight = parseInt(window.getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
        
        // row-gap이 0이므로 margin-bottom만 사용
        const contentHeight = item.getBoundingClientRect().height;
        const marginBottom = parseInt(window.getComputedStyle(item).getPropertyValue('margin-bottom')) || 20;
        
        // 총 높이 = 콘텐츠 높이 + 마진
        const totalHeight = contentHeight + marginBottom;
        
        // 필요한 행 수 계산 (rowHeight가 1px이므로 총 높이와 동일)
        const rowSpan = Math.ceil(totalHeight / rowHeight);
        
        item.style.gridRowEnd = "span " + rowSpan;
    }

    function resizeAllGridItems() {
        const allItems = document.getElementsByClassName("category-group");
        for (let i = 0; i < allItems.length; i++) {
            resizeGridItem(allItems[i]);
        }
    }

    // 아코디언 토글 (모바일)
    function toggleAccordion(header) {
        if (!isMobile) return;

        const bookmarkList = header.nextElementSibling;
        const toggle = header.querySelector('.accordion-toggle');
        
        // 현재 활성 상태 확인
        const isActive = bookmarkList.classList.contains('active');
        
        // 모든 아코디언 닫기
        document.querySelectorAll('.bookmark-list').forEach(list => {
            list.classList.remove('active');
        });
        document.querySelectorAll('.accordion-toggle').forEach(t => {
            t.classList.remove('active');
        });
        
        // 클릭한 아코디언만 열기 (이미 열려있었다면 닫힌 상태 유지)
        if (!isActive) {
            bookmarkList.classList.add('active');
            toggle.classList.add('active');
        }

        // 아코디언 애니메이션 후 레이아웃 재계산
        setTimeout(resizeAllGridItems, 350);
    }

    // 화면 크기 변경 감지
    let resizeTimeout;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
            const wasMobile = isMobile;
            isMobile = window.innerWidth <= 768;
            
            // 모바일 ↔ 데스크톱 전환 시
            if (wasMobile !== isMobile) {
                if (!isMobile) {
                    // 데스크톱: 모든 아코디언 펼치기
                    document.querySelectorAll('.bookmark-list').forEach(list => {
                        list.classList.add('active');
                    });
                } else {
                    // 모바일: 첫 번째만 펼치기
                    document.querySelectorAll('.bookmark-list').forEach((list, index) => {
                        if (index === 0) {
                            list.classList.add('active');
                        } else {
                            list.classList.remove('active');
                        }
                    });
                    document.querySelectorAll('.accordion-toggle').forEach((t, index) => {
                        if (index === 0) {
                            t.classList.add('active');
                        } else {
                            t.classList.remove('active');
                        }
                    });
                }
            }
            
            // Masonry 레이아웃 재계산
            resizeAllGridItems();
        }, 100);
    });

    // 데이터 로드 및 렌더링
    async function loadData() {
        const cachedData = localStorage.getItem(STORAGE_KEY);
        
        if (cachedData) {
            const data = JSON.parse(cachedData);
            renderDashboard(data);
        }

        try {
            const res = await fetch(API_URL);
            const newData = await res.json();
            
            if (JSON.stringify(newData) !== cachedData) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
                renderDashboard(newData);
            }
        } catch (err) {
            console.error("데이터 갱신 실패:", err);
        }
    }

    function renderDashboard(categories) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';
        
        categories.forEach((cat, index) => {
            const group = document.createElement('div');
            group.className = 'category-group';
            
            const linksHtml = cat.links.map(link => {
                let iconHtml;
                if (link.icon) {
                    iconHtml = `<div class="icon-box emoji">${link.icon}</div>`;
                } else {
                    try {
                        const domain = new URL(link.url).hostname;
                        iconHtml = `<div class="icon-box"><img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="${link.name}"></div>`;
                    } catch(e) {
                        iconHtml = `<div class="icon-box emoji">🔗</div>`;
                    }
                }
                
                return `
                    <a href="${link.url}" class="bookmark-item" target="_blank">
                        ${iconHtml}
                        <span class="bookmark-name">${link.name}</span>
                        <span class="bookmark-arrow">→</span>
                    </a>
                `;
            }).join('');
            
            // 데스크톱에서는 모든 리스트 활성화, 모바일에서는 첫 번째만
            const activeClass = !isMobile ? 'active' : (index === 0 ? 'active' : '');
            const toggleActiveClass = !isMobile ? '' : (index === 0 ? 'active' : '');
            
            group.innerHTML = `
                <div class="category-header" onclick="toggleAccordion(this)">
                    <div class="category-title">
                        <span>${cat.title}</span>
                        <span class="category-count">${cat.links.length}</span>
                    </div>
                    <div class="accordion-toggle ${toggleActiveClass}">▼</div>
                </div>
                <div class="bookmark-list ${activeClass}">
                    ${linksHtml}
                </div>
            `;
            
            grid.appendChild(group);
        });

        // 이미지 로드 완료 후 레이아웃 재계산
        const images = grid.querySelectorAll('img');
        let loadedCount = 0;
        const totalImages = images.length;

        if (totalImages === 0) {
            // 이미지가 없으면 바로 계산
            setTimeout(resizeAllGridItems, 200);
        } else {
            // 각 이미지 로드 완료 시 재계산
            images.forEach(img => {
                if (img.complete) {
                    loadedCount++;
                } else {
                    img.addEventListener('load', function() {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            resizeAllGridItems();
                        }
                    });
                }
            });
            
            // 타임아웃으로도 재계산 (안전장치)
            setTimeout(resizeAllGridItems, 200);
            setTimeout(resizeAllGridItems, 500);
        }
    }

    // 검색 관련 함수
    function updateEngineIcon() {
        const select = document.getElementById('search-engine');
        const domain = select.options[select.selectedIndex].getAttribute('data-domain');
        document.getElementById('current-engine-icon').src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    }

    function doSearch() {
        const engine = document.getElementById('search-engine').value;
        const query = document.getElementById('search-input').value;
        if (query.trim()) {
            window.open(engine + encodeURIComponent(query), '_blank');
        }
    }

    // 시계 업데이트
    function updateClock() {
        const now = new Date();
        document.getElementById('cur-time').innerText = now.toLocaleTimeString('ko-KR', { 
            hour12: false, 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
        });
        document.getElementById('cur-date').innerText = now.toLocaleDateString('ko-KR', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            weekday: 'short' 
        });
        
        const hour = now.getHours();
        const greeting = document.getElementById('greeting');
        if(hour < 6) greeting.innerText = "평온한 밤입니다 🌙";
        else if(hour < 12) greeting.innerText = "좋은 아침이에요 ☀️";
        else if(hour < 18) greeting.innerText = "즐거운 오후입니다 ☕";
        else greeting.innerText = "편안한 저녁 되세요 🌃";
    }

    // 초기화
    setInterval(updateClock, 1000);
    updateClock();
    loadData();
</script>

</body>
</html>
