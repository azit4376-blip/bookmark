<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="u36-FtkXCnHJ3qi2akqjFoLQ2M7pudNXb6r19_hKcMg" />
    
    <title>스마트 대시보드 | 나만의 통합 포털 서비스</title>
    <meta name="description" content="자주 사용하는 모든 사이트를 한눈에 관리하는 개인 맞춤형 대시보드입니다. 빠른 검색과 카테고리별 링크 정리를 지원합니다.">
    <meta name="keywords" content="대시보드, 통합포털, 즐겨찾기, 링크관리, 시작페이지">
    <link rel="canonical" href="https://azit4376-blip.github.io/bookmark/">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="스마트 대시보드 Pro">
    <meta property="og:description" content="매일 방문하는 사이트들을 한 곳에서 편리하게 관리하세요.">
    <meta property="og:url" content="https://azit4376-blip.github.io/bookmark/">
    <meta property="og:image" content="https://www.google.com/s2/favicons?domain=google.com&sz=128">

    <style>
        :root {
            --bg-color: #f4f7f9;
            --accent-blue: #007aff;
            --text-dark: #1d1d1f;
            --text-gray: #6e6e73;
            --card-bg: #ffffff;
            --gap-size: 25px;
        }
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color); margin: 0; padding: 0;
            color: var(--text-dark); min-height: 100vh;
        }

        .top-nav {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            padding: 10px 20px; display: flex; justify-content: flex-end;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05); gap: 10px;
        }
        .nav-btn {
            font-size: 12px; font-weight: 600; color: var(--text-gray);
            text-decoration: none; cursor: pointer; padding: 5px 12px; border-radius: 20px; transition: 0.2s;
        }
        .nav-btn:hover { background: var(--accent-blue); color: white; }

        .container { max-width: 1850px; margin: 0 auto; padding: 20px 20px 40px; box-sizing: border-box; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 0 10px; }
        header h1 { font-size: 28px; font-weight: 800; margin: 0; }
        .clock-box { text-align: right; }
        #cur-time { font-size: 24px; font-weight: 700; color: var(--accent-blue); }
        #cur-date { font-size: 14px; color: var(--text-gray); }

        .search-section { max-width: 850px; margin: 0 auto 60px; }
        .search-bar {
            display: flex; background: #fff; border-radius: 50px; padding: 10px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #eee; align-items: center;
        }
        .engine-selector {
            display: flex; align-items: center; background: #f0f2f5; 
            padding: 5px 12px; border-radius: 25px; margin-right: 10px; border: 1px solid #e5e5e5;
        }
        .engine-icon { width: 20px; height: 20px; margin-right: 8px; border-radius: 4px; }
        .engine-select { border: none; background: transparent; font-size: 14px; font-weight: 700; outline: none; cursor: pointer; }
        .search-bar input { border: none; outline: none; width: 100%; font-size: 17px; padding: 10px; background: transparent; }
        .search-btn { border: none; background: none; cursor: pointer; font-size: 20px; padding: 0 10px; color: var(--accent-blue); }

        .dashboard-main { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            grid-auto-rows: 1px;
            gap: 0 var(--gap-size);
            align-items: start;
        }

        .category-group {
            background: #fff; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02); overflow: hidden; 
            margin-bottom: var(--gap-size);
            width: 100%;
            display: inline-block;
        }

        .category-title { 
            font-size: 15.5px; font-weight: 800; color: var(--text-dark);
            padding: 20px 22px; border-left: 5px solid var(--accent-blue);
            background: #fff;
        }
        .bookmark-list { display: flex; flex-direction: column; gap: 6px; padding: 0 18px 20px 18px; }
        .bookmark-item {
            background: #f9f9fb; border-radius: 12px; padding: 11px 15px;
            text-decoration: none; color: inherit; display: flex; align-items: center;
            transition: 0.2s; border: 1px solid transparent;
        }
        .bookmark-item:hover { transform: translateX(4px); border-color: var(--accent-blue); background: #fff; }
        
        .icon-box {
            width: 28px; height: 28px; border-radius: 6px; background: #fff;
            display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0;
            font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden;
        }
        .icon-box img { width: 18px; height: 18px; object-fit: contain; }
        .name { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #guide-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #fff; padding: 30px; border-radius: 20px; max-width: 400px; width: 90%;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .close-modal { background: var(--accent-blue); color: #fff; padding: 10px 25px; border-radius: 50px; cursor: pointer; border: none; font-weight: 600; }

        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; gap: 15px; }
            .dashboard-main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="nav-btn" onclick="showGuide('start')">🏠 시작페이지 설정</div>
    <div class="nav-btn" onclick="showGuide('book')">⭐ 즐겨찾기(Ctrl+D)</div>
</div>

<div class="container">
    <header>
        <h1 id="greeting">Portal Master</h1>
        <div class="clock-box">
            <div id="cur-time"></div>
            <div id="cur-date"></div>
        </div>
    </header>

    <div class="search-section">
        <div class="search-bar">
            <div class="engine-selector">
                <img id="current-engine-icon" class="engine-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64">
                <select class="engine-select" id="search-engine" onchange="updateEngineIcon()">
                    <option value="https://www.google.com/search?q=" data-domain="google.com">구글</option>
                    <option value="https://search.naver.com/search.naver?query=" data-domain="naver.com">네이버</option>
                    <option value="https://search.daum.net/search?q=" data-domain="daum.net">다음</option>
                    <option value="https://www.bing.com/search?q=" data-domain="bing.com">Bing</option>
                    <option value="https://www.youtube.com/results?search_query=" data-domain="youtube.com">유튜브</option>
                    <option value="https://namu.wiki/w/" data-domain="namu.wiki">나무위키</option>
                    <option value="https://www.coupang.com/np/search?channel=user_side&lptag=AF1397652&q=" data-domain="coupang.com">쿠팡</option>
                    <option value="https://www.musinsa.com/search/musinsa/integration?q=" data-domain="musinsa.com">무신사</option>
                </select>
            </div>
            <input type="text" id="search-input" placeholder="검색어를 입력하세요" onkeypress="if(event.keyCode==13) doSearch();">
            <button class="search-btn" onclick="doSearch()">🔍</button>
        </div>
    </div>

    <div class="dashboard-main" id="main-grid"></div>

    <div style="text-align: center; margin-top: 80px; color: #bbb; font-size: 11px; padding-bottom: 40px;">
        © 2026 Smart Dashboard Pro. All rights reserved.
    </div>
</div>

<div id="guide-modal">
    <div class="modal-content">
        <h2 id="modal-title">안내</h2>
        <p id="modal-text"></p>
        <button class="close-modal" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    function showGuide(type) {
        const modal = document.getElementById('guide-modal');
        if(type === 'start') {
            document.getElementById('modal-title').innerText = "🏠 시작페이지 설정";
            document.getElementById('modal-text').innerHTML = "브라우저 우측 상단 [점 3개] -> [설정] -> [시작 그룹]에서 현재 주소를 등록하세요!";
        } else {
            document.getElementById('modal-title').innerText = "⭐ 즐겨찾기 단축키";
            document.getElementById('modal-text').innerHTML = "Windows: Ctrl + D / Mac: Cmd + D";
        }
        modal.style.display = 'flex';
    }
    function closeModal() { document.getElementById('guide-modal').style.display = 'none'; }

    const API_URL = "https://script.google.com/macros/s/AKfycbwp_biaKSxfJMMcFcvP23s8fPHXUPwha9GbsXxX3QmBDqyVGBN4MBSDfu0zWiDMK9DK/exec";

    function resizeGridItem(item){
        const grid = document.getElementById("main-grid");
        const rowHeight = parseInt(window.getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
        const rowGap = parseInt(window.getComputedStyle(grid).getPropertyValue('grid-row-gap'));
        const contentHeight = item.getBoundingClientRect().height;
        const verticalMargin = 25;
        const rowSpan = Math.ceil((contentHeight + verticalMargin) / (rowHeight + rowGap));
        item.style.gridRowEnd = "span " + rowSpan;
    }

    function resizeAllGridItems(){
        const allItems = document.getElementsByClassName("category-group");
        for(let x=0; x<allItems.length; x++){
            resizeGridItem(allItems[x]);
        }
    }

    async function loadData() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            await renderDashboard(data);
            setTimeout(resizeAllGridItems, 150);
        } catch (err) {
            console.error(err);
        }
    }

    function renderDashboard(categories) {
        return new Promise((resolve) => {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = ''; 
            categories.forEach((cat) => {
                const group = document.createElement('div');
                group.className = 'category-group';
                const linksHtml = cat.links.map(link => `
                    <a href="${link.url}" class="bookmark-item" target="_blank">
                        <div class="icon-box">${link.icon ? link.icon : `<img src="https://www.google.com/s2/favicons?domain=${link.url}&sz=64">`}</div>
                        <span class="name">${link.name}</span>
                    </a>
                `).join('');
                group.innerHTML = `<div class="category-title"><span>${cat.title}</span></div><div class="bookmark-list">${linksHtml}</div>`;
                grid.appendChild(group);
            });
            resolve();
        });
    }

    window.addEventListener("resize", resizeAllGridItems);

    function updateEngineIcon() {
        const select = document.getElementById('search-engine');
        document.getElementById('current-engine-icon').src = `https://www.google.com/s2/favicons?domain=${select.options[select.selectedIndex].getAttribute('data-domain')}&sz=64`;
    }
    function doSearch() {
        const engine = document.getElementById('search-engine').value;
        const query = document.getElementById('search-input').value;
        if (query.trim()) window.open(engine + encodeURIComponent(query), '_blank');
    }

    // [복구] 시간 및 인사말 업데이트 함수
    function updateClock() {
        const now = new Date();
        document.getElementById('cur-time').innerText = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('cur-date').innerText = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        
        const hour = now.getHours();
        const greeting = document.getElementById('greeting');
        if(hour < 6) greeting.innerText = "평온한 밤입니다 🌙";
        else if(hour < 12) greeting.innerText = "좋은 아침이에요 ☀️";
        else if(hour < 18) greeting.innerText = "즐거운 오후입니다 ☕";
        else greeting.innerText = "편안한 저녁 되세요 🌃";
    }

    setInterval(updateClock, 1000);
    updateClock();
    loadData();
</script>
</body>
</html>
