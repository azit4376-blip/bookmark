<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="u36-FtkXCnHJ3qi2akqjFoLQ2M7pudNXb6r19_hKcMg" />
    <title>스마트 대시보드 | 나만의 통합 포털 서비스</title>
    <meta name="description" content="자주 사용하는 모든 사이트를 한눈에 관리하는 개인 맞춤형 대시보드입니다. 빠른 검색과 카테고리별 링크 정리를 지원합니다.">
    <meta name="keywords" content="대시보드, 통합포털, 즐겨찾기, 링크관리, 시작페이지">
    <link rel="canonical" href="https://azit4376-blip.github.io/bookmark/">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="스마트 대시보드 Pro">
    <meta property="og:description" content="매일 방문하는 사이트들을 한 곳에서 편리하게 관리하세요.">
    <meta property="og:url" content="https://azit4376-blip.github.io/bookmark/">
    <meta property="og:image" content="https://www.google.com/s2/favicons?domain=google.com&sz=128">

        <link rel="stylesheet" href="styles.css">


</head>
<body>

<!-- 상단 네비게이션 -->
<div class="top-nav">
    <div class="nav-btn" onclick="showGuide('start')">
        <span>🏠</span>
        <span>시작페이지</span>
    </div>
    <div class="nav-btn" onclick="showGuide('book')">
        <span>⭐</span>
        <span>즐겨찾기</span>
    </div>
</div>

<!-- 메인 컨테이너 -->
<div class="container">
    <!-- 헤더 -->
    <header>
        <div class="header-left">
            <h1 id="greeting">Portal Master</h1>
            <div class="subtitle">나만의 통합 대시보드</div>
        </div>
        <div class="clock-box">
            <div id="cur-time"></div>
            <div id="cur-date"></div>
        </div>
    </header>

    <!-- 검색 섹션 -->
    <div class="search-section">
        <div class="search-bar">
            <div class="engine-selector">
                <img id="current-engine-icon" class="engine-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt="검색엔진">
                <select class="engine-select" id="search-engine" onchange="updateEngineIcon()">
                    <option value="https://www.google.com/search?q=" data-domain="google.com">구글</option>
                    <option value="https://search.naver.com/search.naver?query=" data-domain="naver.com">네이버</option>
                    <option value="https://search.daum.net/search?q=" data-domain="daum.net">다음</option>
                    <option value="https://www.bing.com/search?q=" data-domain="bing.com">Bing</option>
                    <option value="https://www.youtube.com/results?search_query=" data-domain="youtube.com">유튜브</option>
                    <option value="https://namu.wiki/w/" data-domain="namu.wiki">나무위키</option>
                    <option value="https://www.coupang.com/np/search?channel=user_side&lptag=AF1397652&q=" data-domain="coupang.com">쿠팡</option>
                    <option value="https://www.musinsa.com/search/musinsa/integration?q=" data-domain="musinsa.com">무신사</option>
                </select>
            </div>
            <input type="text" id="search-input" placeholder="검색어를 입력하세요" onkeypress="if(event.keyCode==13) doSearch();">
            <button class="search-btn" onclick="doSearch()">🔍</button>
        </div>
    </div>

    <!-- 대시보드 그리드 -->
    <div class="dashboard-main" id="main-grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <!-- 푸터 -->
    <div class="footer">
        © 2026 Smart Dashboard Pro. All rights reserved.
    </div>
</div>

<!-- 가이드 모달 -->
<div id="guide-modal">
    <div class="modal-content">
        <h2 id="modal-title">안내</h2>
        <p id="modal-text"></p>
        <button class="close-modal" onclick="closeModal()">확인</button>
    </div>
</div>

    <script src="script.js" defer></script>



</body>
</html>
